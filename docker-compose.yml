services:
  mysql:
    image: mysql:8.0
    container_name: mysql-agora-container
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: agora_db
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql-agora-data:/var/lib/mysql

volumes:
  mysql-agora-data: